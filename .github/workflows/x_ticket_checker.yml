name: X Ticket Transfer Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-x-ticket:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # リポジトリへの書き込み権限を付与

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests resend

      - name: Run Ticket Monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: python check_x_ticket.py

      - name: Commit and push notification history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add notified_ids.txt || true
          git diff --staged --quiet || (git commit -m "Chore: Update notified history" && git push)
